
name: Build Myanmar Law Library APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          PROJECT_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Law-Library-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
